name: PRANATA checks
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-only-password
          MYSQL_DATABASE: pranata_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pci-only-password"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: pranata_test
      DB_USERNAME: root
      DB_PASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, dom, xml, xmlwriter, curl, fileinfo
          coverage: none
          tools: composer:v2
      - name: Prepare environment
        run: |
          cp .env.example .env
          mkdir -p artifacts
      - name: Install dependencies
        run: composer update --no-interaction --prefer-dist --no-progress
      - name: Check actual PHP and extensions
        run: composer check-platform-reqs
      - name: Validate Composer manifest
        run: composer validate --no-check-publish
      - name: PHP syntax
        run: find app bootstrap config database routes tests public -name '*.php' ! -name '*.blade.php' -print0 | xargs -0 -n1 php -l
      - name: Compile views and routes
        run: |
          php artisan key:generate
          php artisan view:cache
          php artisan route:list --except-vendor
      - name: MySQL feature tests
        run: php artisan test --log-junit artifacts/phpunit.xml
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Browser tooling
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Seed isolated demonstration data
        run: |
          php artisan migrate --force
          php artisan db:seed --class=DemoSeeder --force
      - name: Capture real application screens and test responsive layouts
        run: |
          php artisan serve --host=127.0.0.1 --port=8000 > /tmp/pranata-preview.log 2>&1 &
          node scripts/capture.mjs
      - name: Upload review assets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pranata-review-assets
          path: |
            composer.lock
            public/images/screenshots/*.png
            artifacts/
          retention-days: 7
