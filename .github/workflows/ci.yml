name: PRANATA checks
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-only-password
          MYSQL_DATABASE: pranata_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pci-only-password"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: pranata_test
      DB_USERNAME: root
      DB_PASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_mysql, dom, xml, curl, fileinfo
          coverage: none
          tools: composer:v2
      - name: Prepare environment
        run: cp .env.example .env
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Validate Composer manifest
        run: composer validate --no-check-publish
      - name: PHP syntax
        run: find app bootstrap config database routes tests public -name '*.php' ! -name '*.blade.php' -print0 | xargs -0 -n1 php -l
      - name: Compile views and routes
        run: |
          php artisan key:generate
          php artisan view:cache
          php artisan route:list --except-vendor
      - name: MySQL feature tests
        run: php artisan test
